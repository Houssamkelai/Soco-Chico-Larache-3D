name: Publish Soco Chico
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified original GLB
        run: python3 deployment/restore_model.py
      - name: Store the verified GLB in the repository
        run: |
          git add assets/soco_chico.glb
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Restore verified original GLB from transport blocks"
            git push
          fi
      - name: Prepare public files
        run: |
          mkdir _site
          cp index.html style.css app.js navigation.js heritage.js .nojekyll _site/
          cp -r assets vendor _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
